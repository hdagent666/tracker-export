name: Build macOS app

# Builds Tracker Export.app on a GitHub macOS (Apple Silicon) runner,
# signs it, and uploads it as a downloadable artifact.
#
# Signing behaviour:
#   - If the repo has Developer ID secrets (see README "Proper signing"),
#     the app is signed with the Developer ID, hardened runtime, and
#     notarized with Apple -> opens with a plain double-click anywhere.
#   - Otherwise the app is ad-hoc signed. It runs fine on your own Mac;
#     on first launch use right-click -> Open (Gatekeeper asks because
#     the app is not notarized).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

# The built-in token needs write access to create a GitHub Release
# when a version tag is pushed.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon (arm64) — matches M-series Macs
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install libxmp
        run: brew install libxmp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install package and PyInstaller
        run: |
          pip install .
          pip install pyinstaller

      - name: Build Tracker Export.app
        run: |
          LIBXMP="$(find /opt/homebrew/lib /usr/local/lib -name 'libxmp*.dylib' 2>/dev/null | head -1)"
          if [ -z "$LIBXMP" ]; then
            echo "libxmp dylib not found after brew install" >&2
            exit 1
          fi
          echo "Bundling $LIBXMP"
          pyinstaller \
            --name "Tracker Export" \
            --windowed \
            --noconfirm \
            --add-binary "$LIBXMP:." \
            macos_launcher.py
          ls -la "dist/Tracker Export.app/Contents/MacOS"

      - name: Sign the app
        env:
          CERT_P12_B64: ${{ secrets.DEVELOPER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="dist/Tracker Export.app"
          if [ -n "$CERT_P12_B64" ]; then
            echo "Developer ID secrets found — signing properly + notarizing."
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PW="$(uuidgen)"
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: \
              -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep 'Developer ID Application' | head -1 \
              | sed -E 's/.*"(.*)"/\1/')"
            echo "Signing as: $IDENTITY"
            codesign --force --deep --options runtime --timestamp \
              --sign "$IDENTITY" "$APP"
            codesign --verify --strict --verbose=2 "$APP"
            ditto -c -k --keepParent "$APP" TrackerExport-notarize.zip
            xcrun notarytool submit TrackerExport-notarize.zip \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
          else
            echo "No Developer ID secrets — ad-hoc signing."
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose=2 "$APP" || true
          fi

      - name: Package the app
        run: |
          ditto -c -k --keepParent "dist/Tracker Export.app" \
            TrackerExport-macOS.zip
          ls -la TrackerExport-macOS.zip

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerExport-macOS
          path: TrackerExport-macOS.zip
          retention-days: 90

      - name: Attach to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TrackerExport-macOS.zip
